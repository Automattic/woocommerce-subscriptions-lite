name: CI

on:
  push:
    branches: [ trunk ]
  pull_request:
    # `edited` re-runs the checks when the description changes, which is where the
    # Engine-Ref line lives (see below).
    types: [ opened, synchronize, reopened, edited ]
  workflow_dispatch:
    inputs:
      engine_ref:
        description: WooCommerce monorepo branch to take the engine package from.
        required: false
        default: trunk

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The engine dependency is a composer path repository expecting the WooCommerce
# monorepo as a sibling checkout (../woocommerce). Every job reconstructs that
# layout with a blobless sparse clone of just the engine package
# (.github/actions/checkout-engine). The clone tracks the monorepo trunk, so
# engine changes surface here as they land; the clone step becomes a Packagist
# dependency once the engine package is published.
#
# A pull request that needs an engine change not yet on trunk names the engine
# branch on a line of its own in the description:
#
#   Engine-Ref: some-engine-branch
#
# Remove the line once the engine change is merged. A manual run takes the
# branch as its engine_ref input. Each job's summary shows the engine branch and
# commit it used.
jobs:
  lint:
    name: Lint and JS unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: woocommerce-subscriptions-lite
    steps:
      - uses: actions/checkout@v4
        with:
          path: woocommerce-subscriptions-lite

      - name: Check out the engine package
        uses: ./woocommerce-subscriptions-lite/.github/actions/checkout-engine
        with:
          engine-ref: ${{ inputs.engine_ref }}
          pr-body: ${{ github.event.pull_request.body }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: PHP coding standards
        run: composer lint

      - uses: actions/setup-node@v4
        with:
          node-version-file: woocommerce-subscriptions-lite/package.json
          cache: npm
          cache-dependency-path: woocommerce-subscriptions-lite/package-lock.json

      - name: Install npm dependencies (builds the bundles)
        run: npm ci

      - name: JS lint
        run: npm run lint:js

      - name: CSS lint
        run: npm run lint:css

      - name: JS unit tests
        run: npm run test:js

  php74:
    name: PHP 7.4 syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The package floor is PHP 7.4, and the PHPCompatibility sniffs in
      # `composer lint` do not know newer syntax, so every file is parsed by 7.4.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
          tools: none

      - name: Lint every PHP file on PHP 7.4
        run: |
          # `|| exit 1` keeps xargs going after a failure, so every error is listed.
          # shellcheck disable=SC2016
          find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -print0 \
            | xargs -0 -n 1 -P 4 sh -c 'php -l "$0" || exit 1' > php-lint.log 2>&1 \
            || { grep -v '^No syntax errors' php-lint.log; exit 1; }
          echo "$( wc -l < php-lint.log ) files parse on PHP 7.4."

  test:
    name: Integration tests (wp-env)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: woocommerce-subscriptions-lite
    steps:
      - uses: actions/checkout@v4
        with:
          path: woocommerce-subscriptions-lite

      - name: Check out the engine package
        uses: ./woocommerce-subscriptions-lite/.github/actions/checkout-engine
        with:
          engine-ref: ${{ inputs.engine_ref }}
          pr-body: ${{ github.event.pull_request.body }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install composer dependencies
        run: composer install --prefer-dist --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version-file: woocommerce-subscriptions-lite/package.json
          cache: npm
          cache-dependency-path: woocommerce-subscriptions-lite/package-lock.json

      - name: Install npm dependencies (builds the bundles)
        run: npm ci

      - name: Start the WordPress test environment
        run: npx wp-env start

      - name: Run the integration suite
        run: composer test:integration

      - name: Show wp-env debug logs on failure
        if: failure()
        timeout-minutes: 2
        run: npx wp-env logs tests --no-watch || true
